services:
  - type: web
    name: gradjobs-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gradjobs-db
          property: connectionString
      - key: SCRAPE_ON_STARTUP
        value: "true"

databases:
  - name: gradjobs-db
    databaseName: gradjobs
    user: gradjobs
    plan: free
